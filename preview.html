<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Brightstar · Resume style preview</title>
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header class="preview-bar">
      <div class="brand">
        <img src="icons/brightstar-icon.svg" alt="" class="brand-icon" />
        <div>
          <h1>Style preview</h1>
          <p class="lede" id="previewLede">Layout only — content is a sample until you generate.</p>
        </div>
      </div>
      <label class="field">
        <span>Template</span>
        <select id="templateSelect"></select>
      </label>
      <div class="segmented" role="group" aria-label="Preview content">
        <button type="button" class="seg-btn active" id="sourceSample">Sample</button>
        <button type="button" class="seg-btn" id="sourceLast" disabled title="Generate a resume first">
          Last resume
        </button>
      </div>
      <button type="button" id="useStyle" class="primary">Use this style</button>
    </header>
    <div class="stage" id="stage">
      <div class="paper">
        <iframe id="page" title="Resume style preview"></iframe>
      </div>
    </div>
    <p class="status" id="status"></p>
    <script type="module" src="preview.js"></script>
  </body>
</html>
