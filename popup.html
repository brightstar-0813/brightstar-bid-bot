<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Resume GPT Builder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <div class="brand">
        <img src="icons/j-icon.svg" alt="J icon" class="brand-icon" />
        <h1>Resume GPT Builder</h1>
      </div>
      <p class="hype">LETS GET TEH JOBS!!! 💪💪💪💪💪</p>

      <label class="field">
        <span>Profile</span>
        <select id="profileSelect"></select>
      </label>

      <div class="row row-inline">
        <button type="button" id="deleteProfile" class="secondary danger" hidden>
          Delete selected profile
        </button>
      </div>

      <label class="field">
        <span>Job description (JD)</span>
        <textarea
          id="jdText"
          placeholder="Paste the job description here..."
          rows="6"
        ></textarea>
      </label>

      <div class="row row-inline">
        <button type="button" id="pasteJd" class="secondary">Paste from clipboard</button>
      </div>

      <div class="row">
        <button type="button" id="generate">Send to Open ChatGPT Tab</button>
        <button type="button" id="reset">Refresh / Reset</button>
      </div>

      <section class="panel" id="addProfilePanel">
        <button type="button" class="panel-toggle" id="toggleAddProfile" aria-expanded="false">
          + Add new profile
        </button>
        <div class="panel-body" id="addProfileBody" hidden>
          <label class="field">
            <span>Profile name</span>
            <input id="newProfileName" type="text" placeholder="e.g. Jane Doe" autocomplete="off" />
          </label>
          <label class="field">
            <span>Prompt content</span>
            <textarea
              id="newProfilePrompt"
              class="prompt-input"
              placeholder="Paste the full independent resume prompt. Include {JD} where the job description should be inserted."
              rows="10"
            ></textarea>
          </label>
          <p class="hint">Must include <code>{JD}</code> placeholder for the job description.</p>
          <div class="row">
            <button type="button" id="saveProfile">Save profile</button>
          </div>
        </div>
      </section>

      <p id="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
